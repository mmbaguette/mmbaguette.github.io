name: Update blog list

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild blog list from Substack
        run: python3 .github/scripts/update_blog.py
      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "No new posts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update blog list from Substack"
            git push
          fi
